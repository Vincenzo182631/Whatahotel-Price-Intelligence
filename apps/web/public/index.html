<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhataHotel Price Intelligence — demo harness</title>
    <link rel="stylesheet" href="/widget.css" />
    <style>
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        margin: 0;
        padding: 32px 20px 64px;
        background: #f2f4f7;
        color: #16181d;
      }
      main {
        max-width: 680px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 4px;
      }
      .sub {
        color: #5b6270;
        margin: 0 0 20px;
        font-size: 0.92rem;
      }
      /* Default is the cautious amber. Only `.banner.real` relaxes it, and only
         after the API confirms every stored rate came from a real source. */
      .banner {
        background: #fff4e5;
        border: 1px solid #f0c896;
        border-left: 4px solid #b06f00;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 0.88rem;
        margin-bottom: 22px;
      }
      .banner.real {
        background: #eef6ff;
        border-color: #b8d4f0;
        border-left-color: #1a63b8;
      }
      /* Fabricated and real rates in one database — indistinguishable once
         stored. The loudest state on purpose. */
      .banner.mixed {
        background: #fdecec;
        border-color: #f0b4b4;
        border-left-color: #b00020;
      }
      form {
        background: #fff;
        border: 1px solid #e2e5ea;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        align-items: end;
      }
      label {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #5b6270;
        margin-bottom: 4px;
      }
      input,
      select,
      button {
        font: inherit;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d5d9e0;
        border-radius: 7px;
        background: #fff;
        box-sizing: border-box;
      }
      button {
        background: #0b5cad;
        color: #fff;
        border-color: #0b5cad;
        cursor: pointer;
        font-weight: 600;
      }
      .full {
        grid-column: 1 / -1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WhataHotel Price Intelligence</h1>
      <p class="sub">Development harness for the embeddable widget.</p>

      <!--
        Filled from /api/v1/health, never hardcoded. The previous version
        asserted "synthetic data" unconditionally, so once the database held
        live rates it was displaying genuine hotel pricing under a notice
        saying no number on the page was real. A safety label that does not
        come from the data is not a safety label.

        It starts in the most cautious state and is only relaxed once the API
        has actually said the data is real — so a failed health call leaves a
        warning up rather than a reassurance.
      -->
      <div class="banner" id="provenance" role="status">
        <strong>Checking data source…</strong> Treat every number on this page as unverified until
        this resolves.
      </div>

      <form id="controls">
        <div class="full">
          <label for="hotel">Hotel</label>
          <select id="hotel"></select>
        </div>
        <div>
          <label for="checkIn">Check in</label>
          <input type="date" id="checkIn" />
        </div>
        <div>
          <label for="checkOut">Check out</label>
          <input type="date" id="checkOut" />
        </div>
        <div>
          <label for="adults">Adults</label>
          <input type="number" id="adults" value="2" min="1" max="10" />
        </div>
        <div>
          <label for="model">Model</label>
          <select id="model">
            <option value="live">Live market (comp set + dates)</option>
            <option value="history">Accrued history</option>
          </select>
        </div>
        <div class="full">
          <label for="room">Room type</label>
          <select id="room">
            <option value="">Lowest available rate</option>
          </select>
        </div>
        <div class="full">
          <button type="submit">Analyze this rate</button>
        </div>
      </form>

      <div id="widget"></div>
    </main>

    <script src="/widget.js"></script>
    <script>
      const form = document.getElementById('controls');
      const hotelSelect = document.getElementById('hotel');
      const roomSelect = document.getElementById('room');
      const modelSelect = document.getElementById('model');
      const checkIn = document.getElementById('checkIn');
      const checkOut = document.getElementById('checkOut');
      const adults = document.getElementById('adults');
      const widget = document.getElementById('widget');

      function isoDaysFromNow(days) {
        return new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
      }

      const escapeHtml = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );

      // Describe the data honestly, from what the API reports.
      async function loadProvenance() {
        const el = document.getElementById('provenance');
        let health;
        try {
          const res = await fetch('/api/v1/health');
          health = await res.json();
        } catch {
          // Leave the cautious default in place. Failing to confirm the data is
          // real is not the same as confirming it is.
          el.innerHTML =
            '<strong>Data source unknown.</strong> The health endpoint could not be reached, so ' +
            'nothing on this page has been verified as real.';
          return;
        }

        const list = (health?.data?.sources ?? [])
          .map((s) => `${escapeHtml(s.display_name)} (${s.observations.toLocaleString()})`)
          .join(', ');

        switch (health?.data?.provenance) {
          case 'REAL':
            el.className = 'banner real';
            el.innerHTML =
              `<strong>Live data.</strong> Rates come from ${list || 'a production source'}. ` +
              'These are real quoted prices.';
            break;
          case 'SYNTHETIC':
            el.className = 'banner';
            el.innerHTML =
              '<strong>Synthetic data.</strong> Every rate shown here is fabricated by a seeded ' +
              'generator for development. These are not real hotel prices, and no number on this ' +
              'page reflects an actual rate at any property.';
            break;
          case 'MIXED':
            el.className = 'banner mixed';
            el.innerHTML =
              '<strong>Mixed data — do not trust anything here.</strong> This database contains ' +
              `both fabricated and real rates (${list}). Once stored they are indistinguishable, ` +
              'so no score on this page can be relied on. Reset and reload from a single source.';
            break;
          default:
            el.className = 'banner';
            el.innerHTML =
              '<strong>No data.</strong> No rates have been collected yet, so there is nothing ' +
              'to analyse.';
        }
      }

      // Match a stay the seed generator actually produced: check-ins start five
      // days out at ~3.3 day intervals.
      checkIn.value = isoDaysFromNow(38);
      checkOut.value = isoDaysFromNow(41);

      async function loadHotels() {
        const res = await fetch('/api/v1/hotels?limit=50');
        const data = await res.json();
        hotelSelect.innerHTML = '';
        (data.hotels || []).forEach((h) => {
          const opt = document.createElement('option');
          opt.value = h.hotel_id;
          opt.textContent =
            h.name + ' — ' + h.destination + (h.has_price_intelligence ? '' : ' (no history yet)');
          hotelSelect.appendChild(opt);
        });
        await loadRooms();
      }

      /** Keep the stay range valid so we never send a request we know is invalid. */
      function normalizeDates() {
        if (!checkIn.value) return false;
        if (!checkOut.value || checkOut.value <= checkIn.value) {
          checkOut.value = new Date(Date.parse(checkIn.value + 'T00:00:00Z') + 3 * 86400000)
            .toISOString()
            .slice(0, 10);
        }
        return true;
      }

      async function loadRooms() {
        roomSelect.innerHTML = '<option value="">Lowest available rate</option>';
        if (!hotelSelect.value || !normalizeDates()) return;
        const params = new URLSearchParams({
          check_in: checkIn.value,
          check_out: checkOut.value,
          adults: adults.value,
        });
        try {
          const res = await fetch(
            '/api/v1/hotels/' + encodeURIComponent(hotelSelect.value) + '/room-types?' + params,
          );
          if (!res.ok) return;
          const data = await res.json();
          (data.room_types || []).forEach((r) => {
            const opt = document.createElement('option');
            opt.value = r.room_type_id;
            opt.textContent =
              r.name +
              ' — ' +
              WahPriceIntelligence.formatMoney(r.nightly) +
              (r.intelligence_available ? '' : ' (thin history)');
            roomSelect.appendChild(opt);
          });
        } catch {
          /* the widget reports its own errors */
        }
      }

      function analyze() {
        if (!normalizeDates()) return;
        WahPriceIntelligence.mount(widget, {
          apiBase: '',
          hotelId: hotelSelect.value,
          checkIn: checkIn.value,
          checkOut: checkOut.value,
          adults: Number(adults.value),
          roomTypeId: roomSelect.value || null,
          model: modelSelect.value,
        });
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        analyze();
      });
      hotelSelect.addEventListener('change', loadRooms);
      modelSelect.addEventListener('change', analyze);
      [checkIn, checkOut, adults].forEach((input) => input.addEventListener('change', loadRooms));

      loadProvenance();
      loadHotels().then(analyze);
    </script>
  </body>
</html>
