# Reclaim database space — the day-the-disk-filled runbook, as a button.
#
# Read scripts/db-maintain.mjs for what is (and is not) touched: audit
# payloads only, never a fact any score or booking link reads. `measure`
# is free to run any time; `apply` truncates ingest_reject and nulls
# rate_observation.raw older than the keep window, then vacuums.
name: Database maintenance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to reclaim, "squeeze" to TRUNCATE observations and re-migrate (free-tier reset, see migration 0015); anything else measures only'
        required: false
        default: 'measure'
      raw_keep_days:
        description: 'Keep raw payloads newer than this many days'
        required: false
        default: '14'
      report:
        description: 'Read-only report. "broken" lists hotels whose rate lookups keep failing (candidate broken Amadeus mappings). "coverage" reports which hotel attributes actually exist and how many neighbours a 2/3/5-mile radius finds. "amenity-spread" shows how many hotels carry each amenity label, which is what decides whether naming one tells a guest anything. Overrides confirm.'
        required: false
        default: ''
        type: choice
        options: ['', 'broken', 'coverage', 'amenity-spread', 'reset-research', 'research-review']
      reject_host:
        description: >-
          Record a human judgement that this host is not any property's own
          site, e.g. com-miami.com. A COMMA-SEPARATED LIST is accepted and
          every host in it is stored with the SAME reason, so hosts that
          differ in kind belong in separate runs. Needs reject_reason, and
          confirm "apply" to write. Matches each host exactly or as a dotted
          suffix, so rejecting a directory covers every subdomain it hands
          out. Overrides confirm.
        required: false
        default: ''
      reject_reason:
        description: 'Why that host is not a property site. Required with reject_host; a bare host teaches the next reader nothing.'
        required: false
        default: ''
      market_probe:
        description: 'Read-only comp-market probe: "<wahHotelId> <checkIn> <nights> <adults>", e.g. "6792 2026-08-30 1 2". Overrides confirm.'
        required: false
        default: ''
      drop_partition:
        description: >-
          Drop ONE observation partition ahead of the retention schedule, e.g.
          rate_observation_2026_08_25. For when the project is near its ceiling
          and the scheduled drop is hours away — DROP is the only operation
          that returns space. The two most recent partitions are always
          refused, whatever is typed. Overrides confirm. The rows are gone and
          this source cannot backfill them (U3).
        required: false
        default: ''

concurrency:
  group: db-maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAW_KEEP_DAYS: ${{ inputs.raw_keep_days }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the database secret is set
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
        run: |
          if [ "$HAS_DATABASE_URL" != "true" ]; then
            echo "::error::DATABASE_URL is not set."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Most of this workflow shells out to psql and needs no dependencies,
      # which is why it ran without either step for fifty runs. The research
      # review is the exception: it imports the compiled packages, because
      # the suspicion scoring belongs beside the resolver it judges rather
      # than duplicated in SQL. Cheap enough at a few seconds, and it keeps
      # one definition of what makes a resolution doubtful.
      - run: npm ci
      - run: npm run build

      - name: Maintain
        env:
          # Through env, never interpolated into the script text, and held to a
          # strict shape before use — workflow inputs are user-typed strings.
          MARKET_PROBE: ${{ inputs.market_probe }}
          DROP_PARTITION: ${{ inputs.drop_partition }}
          REJECT_HOST: ${{ inputs.reject_host }}
          REJECT_REASON: ${{ inputs.reject_reason }}
        run: |
          set -o pipefail
          if [ -n "$DROP_PARTITION" ]; then
            # Shape-checked here as well as in the script: this value reaches a
            # DDL statement, and one validation is one place to forget.
            if ! echo "$DROP_PARTITION" | grep -Eq '^rate_observation_[0-9]{4}_[0-9]{2}_[0-9]{2}$'; then
              echo '::error::drop_partition must look like rate_observation_2026_08_25'
              exit 1
            fi
            node scripts/db-maintain.mjs --drop-partition "$DROP_PARTITION" 2>&1 | tee maintain.log
          elif [ -n "$REJECT_HOST" ]; then
            # A hostname and nothing else. This value reaches a stored
            # judgement that clears hotels, and workflow inputs are
            # user-typed strings.
            # One or more bare hostnames, comma-separated. Spaces are
            # tolerated around the commas and nothing else is.
            if ! echo "$REJECT_HOST" | grep -Eq '^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+( *, *[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+)*$'; then
              echo '::error::reject_host must be one or more bare hostnames, comma-separated, e.g. com-miami.com,hotel-nyc.com'
              exit 1
            fi
            if [ -z "$REJECT_REASON" ]; then
              echo '::error::reject_host needs reject_reason. The table outlives anyone'"'"'s memory of why a row is in it.'
              exit 1
            fi
            if [ "${{ inputs.confirm }}" = "apply" ]; then
              node scripts/db-maintain.mjs --reject-host "$REJECT_HOST" --reason "$REJECT_REASON" --apply 2>&1 | tee maintain.log
            else
              node scripts/db-maintain.mjs --reject-host "$REJECT_HOST" --reason "$REJECT_REASON" 2>&1 | tee maintain.log
            fi
          elif [ "${{ inputs.report }}" = "broken" ]; then
            node scripts/db-maintain.mjs --broken 2>&1 | tee maintain.log
          elif [ "${{ inputs.report }}" = "coverage" ]; then
            node scripts/db-maintain.mjs --coverage 2>&1 | tee maintain.log
          elif [ "${{ inputs.report }}" = "amenity-spread" ]; then
            node scripts/db-maintain.mjs --amenity-spread 2>&1 | tee maintain.log
          elif [ "${{ inputs.report }}" = "research-review" ]; then
            node scripts/db-maintain.mjs --research-review 2>&1 | tee maintain.log
          elif [ "${{ inputs.report }}" = "reset-research" ]; then
            # Destructive, so it honours confirm the same way every other
            # write here does: without it this reports and changes nothing.
            if [ "${{ inputs.confirm }}" = "apply" ]; then
              node scripts/db-maintain.mjs --reset-research --apply 2>&1 | tee maintain.log
            else
              node scripts/db-maintain.mjs --reset-research 2>&1 | tee maintain.log
            fi
          elif [ -n "$MARKET_PROBE" ]; then
            if ! echo "$MARKET_PROBE" | grep -Eq '^[0-9]+ [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]+ [0-9]+$'; then
              echo '::error::market_probe must look like "6792 2026-08-30 1 2"'
              exit 1
            fi
            # shellcheck disable=SC2086 — the shape check above makes the split safe.
            node scripts/db-maintain.mjs --market $MARKET_PROBE 2>&1 | tee maintain.log
          elif [ "${{ inputs.confirm }}" = "squeeze" ]; then
            node scripts/db-maintain.mjs --squeeze 2>&1 | tee maintain.log
          elif [ "${{ inputs.confirm }}" = "apply" ]; then
            node scripts/db-maintain.mjs --apply 2>&1 | tee maintain.log
          else
            node scripts/db-maintain.mjs 2>&1 | tee maintain.log
          fi

      - name: Summarise
        if: always()
        run: |
          { echo '## Database maintenance'; echo; echo '```'; cat maintain.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
