# Reclaim database space — the day-the-disk-filled runbook, as a button.
#
# Read scripts/db-maintain.mjs for what is (and is not) touched: audit
# payloads only, never a fact any score or booking link reads. `measure`
# is free to run any time; `apply` truncates ingest_reject and nulls
# rate_observation.raw older than the keep window, then vacuums.
name: Database maintenance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to reclaim, "squeeze" to TRUNCATE observations and re-migrate (free-tier reset, see migration 0015); anything else measures only'
        required: false
        default: 'measure'
      raw_keep_days:
        description: 'Keep raw payloads newer than this many days'
        required: false
        default: '14'
      market_probe:
        description: 'Read-only comp-market probe: "<wahHotelId> <checkIn> <nights> <adults>", e.g. "6792 2026-08-30 1 2". Overrides confirm.'
        required: false
        default: ''

concurrency:
  group: db-maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAW_KEEP_DAYS: ${{ inputs.raw_keep_days }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the database secret is set
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
        run: |
          if [ "$HAS_DATABASE_URL" != "true" ]; then
            echo "::error::DATABASE_URL is not set."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Maintain
        env:
          # Through env, never interpolated into the script text, and held to a
          # strict shape before use — workflow inputs are user-typed strings.
          MARKET_PROBE: ${{ inputs.market_probe }}
        run: |
          set -o pipefail
          if [ -n "$MARKET_PROBE" ]; then
            if ! echo "$MARKET_PROBE" | grep -Eq '^[0-9]+ [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]+ [0-9]+$'; then
              echo '::error::market_probe must look like "6792 2026-08-30 1 2"'
              exit 1
            fi
            # shellcheck disable=SC2086 — the shape check above makes the split safe.
            node scripts/db-maintain.mjs --market $MARKET_PROBE 2>&1 | tee maintain.log
          elif [ "${{ inputs.confirm }}" = "squeeze" ]; then
            node scripts/db-maintain.mjs --squeeze 2>&1 | tee maintain.log
          elif [ "${{ inputs.confirm }}" = "apply" ]; then
            node scripts/db-maintain.mjs --apply 2>&1 | tee maintain.log
          else
            node scripts/db-maintain.mjs 2>&1 | tee maintain.log
          fi

      - name: Summarise
        if: always()
        run: |
          { echo '## Database maintenance'; echo; echo '```'; cat maintain.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
