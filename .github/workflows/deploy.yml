# Deploy the API and widget to Vercel.
#
# Manual dispatch. The Vercel dashboard's git integration can do this on every
# push once the repo is imported there — this workflow exists so a deploy can
# also be driven from here, the same way everything else in this repo is: add
# the named secret, dispatch, read the summary.
#
# Required repository secrets:
#   VERCEL_TOKEN  Vercel dashboard → Account Settings → Tokens
#   DATABASE_URL  already set for collection — the pooler hostname the
#                 serverless runtime needs is derived from it at deploy time
#
# The project does NOT have to exist first: `vercel link` creates it under the
# token's account on the first run and attaches to it on every run after. The
# runtime environment (DATABASE_URL with the -pooler host, CORS_ORIGIN) is
# pushed into the Vercel project by this workflow, so the dashboard needs no
# hand-editing. Secrets are checked by name, never enumerated: enumerating the
# secret store is what tripped GitHub's malicious-workflow detector on the
# database-setup workflow.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production (unchecked = preview deployment)'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check the secrets are set
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing VERCEL_TOKEN"
          [ "$HAS_DB" = "true" ]    || missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see docs/runbooks/deploy.md."
            exit 1
          fi

      - run: npm ci

      - name: Link the Vercel project (created on first run)
        run: npx vercel link --yes --project whatahotel-price-intelligence-api --token=${{ secrets.VERCEL_TOKEN }}

      - name: Push the runtime environment into the project
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          WAH_KEY: ${{ secrets.WAH_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Serverless instances each open their own database connection, so
          # the function must use the Neon POOLER endpoint — the repo secret
          # holds the direct endpoint (migrations need that one). Derive the
          # pooler hostname; a URL that already carries -pooler, or is not a
          # Neon host, passes through unchanged.
          POOLED=$(printf '%s' "$DB_URL" | sed -E 's/@([^.@/]+)\.([^/]*neon\.tech)/@\1-pooler.\2/; s/-pooler-pooler/-pooler/')
          echo "::add-mask::$POOLED"
          for envname in production preview; do
            npx vercel env rm DATABASE_URL "$envname" --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$POOLED" | npx vercel env add DATABASE_URL "$envname" --token="$VERCEL_TOKEN"
            npx vercel env rm CORS_ORIGIN "$envname" --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            # The allowlist the browser is checked against. The rpx-dev host is
            # WhataHotel's staging site — the widget is integrated there first,
            # and without it every call from staging fails CORS while looking
            # like a broken embed. An origin off this list gets no header at all.
            printf '%s' 'https://www.whatahotel.com,https://whatahotel.com,https://wah.rpx-dev.com' | npx vercel env add CORS_ORIGIN "$envname" --token="$VERCEL_TOKEN"
            # On-demand scoring fetches a guest's stay live when nothing has
            # collected it. Without the key that path silently degrades to the
            # honest no-score state, so the function gets the key when the
            # repo has it and simply skips on-demand when it does not.
            if [ -n "$WAH_KEY" ]; then
              npx vercel env rm WAH_API_KEY "$envname" --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "$WAH_KEY" | npx vercel env add WAH_API_KEY "$envname" --token="$VERCEL_TOKEN"
            fi
            # The reasoning layer rewords the already-computed explanation.
            # Optional in exactly the same way: without it the API returns the
            # deterministic sentences and nothing else about the response
            # moves. Server side only — it reaches the function and nothing
            # else, and never the browser.
            #
            # GOOGLE_PLACES_API_KEY is deliberately NOT pushed here. The
            # reputation sweep runs in Actions and writes to the database; the
            # function only ever reads what it already stored, so giving the
            # function that key would widen its blast radius for nothing.
            if [ -n "$OPENAI_KEY" ]; then
              npx vercel env rm OPENAI_API_KEY "$envname" --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "$OPENAI_KEY" | npx vercel env add OPENAI_API_KEY "$envname" --token="$VERCEL_TOKEN"

              # 12s, not the code default of 6s. Measured 2026-08-28 (live
              # probe, 6 reasoner calls): four of six timed out at 6s, so the
              # model wrote almost nothing in production and every hotel_value
              # shipped as TEMPLATE — the OpenAI spend bought prose the guest
              # never saw. The call is synchronous on warm requests, so this is
              # a real latency ceiling; it is paid at most once per stay per
              # hour (OPENAI_INTELLIGENCE_CACHE_MINUTES) and only when OpenAI
              # is actually slow. Cold requests skip the model entirely and are
              # unaffected. Not a secret — set here so it is versioned beside
              # the reasoning instead of living unexplained in a dashboard.
              npx vercel env rm OPENAI_TIMEOUT_MS "$envname" --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "12000" | npx vercel env add OPENAI_TIMEOUT_MS "$envname" --token="$VERCEL_TOKEN"
            fi
          done

      - name: Pull the Vercel project settings and environment
        run: npx vercel pull --yes --environment=${{ inputs.production && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel build ${{ inputs.production && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          set -o pipefail
          npx vercel deploy --prebuilt ${{ inputs.production && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} | tee deploy-url.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Deploy'
            echo
            echo "Mode: ${{ inputs.production && 'production' || 'preview' }}"
            echo
            if [ -s deploy-url.txt ]; then
              echo "Deployed to: $(tail -1 deploy-url.txt)"
            else
              echo '(no deployment URL captured)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
