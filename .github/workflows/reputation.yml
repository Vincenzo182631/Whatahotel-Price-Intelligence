# Resolve hotels to Google places and refresh their guest ratings.
#
# The sweep also runs as the last step of every rate collection, which is the
# right cadence for keeping up. This workflow exists for the other case: running
# it on its own, now, without spending WhataHotel API calls to get at it —
# after adding the key, after a threshold change, or to see the match split
# before trusting it.
#
# Required repository secrets:
#   DATABASE_URL             the same Postgres collection writes to
#   GOOGLE_PLACES_API_KEY    optional; without it this reports and exits 0
#
# ── What this writes, and what it must never write ────────────────────────
#
# The rating is an INTELLIGENCE SIGNAL, not a term in any score. Nothing under
# packages/core/src/scoring reads it. It informs the explanation and it is
# shown to a guest beside the price, and that is the whole of its job.
#
# A doubtful match stores no data, and a FAILED lookup stores nothing at all —
# the queue never revisits a NO_MATCH, so recording one on a timeout would
# retire a hotel from reputation permanently. See
# docs/runbooks/reputation-and-reasoning.md.

name: Refresh guest reputation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max hotels to resolve or refresh in this run'
        required: false
        default: '200'
      dry_run:
        description: 'Show the queue only — call Google for nothing'
        type: boolean
        required: false
        default: false
      sync_pages:
        description: >-
          Read hotel pages for street addresses BEFORE sweeping. On by
          default because the order matters: a hotel with no coordinates is
          only resolvable once it has an address, and the sweep skips it
          otherwise until the next refresh window.
        type: boolean
        required: false
        default: true
      pages_limit:
        description: 'Max hotel pages to read in this run'
        required: false
        default: '400'
      verified_unplaced:
        description: >-
          Backfill only: sweep the hotels whose VERIFIED match already knows
          their position, from before that position was stored (migration
          0018). One Place Details call each and no Text Search — the ordinary
          queue puts never-looked hotels first and every VERIFIED hotel behind
          them, so it cannot reach these few affordably.
        type: boolean
        required: false
        default: false
      refresh_hours:
        description: >-
          Refresh VERIFIED hotels older than this many hours (default 168).
          Set low (e.g. 1) ONLY for a deliberate backfill — every refreshed
          hotel is a billed Place Details call.
        required: false
        default: ''

# One sweep at a time. Two overlapping runs would pay twice for the same
# lookups and race on the same hotel rows.
concurrency:
  group: reputation-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      # Empty means the code default (168h). See the input description.
      GOOGLE_PLACES_REFRESH_HOURS: ${{ inputs.refresh_hours }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Which secrets are present
        # Booleans per named secret, never a dump of the whole secret store —
        # enumerating it is the shape of an exfiltration attack and GitHub's
        # detector is right to flag it. See db-setup.yml for the incident.
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY != '' }}
        run: |
          echo "DATABASE_URL present:          $HAS_DATABASE_URL"
          echo "GOOGLE_PLACES_API_KEY present: $HAS_GOOGLE_PLACES_API_KEY"

      - name: Fail early if the database is missing
        run: |
          # The Google key being absent is a supported configuration and the
          # sweep says so for itself. The database being absent is not: the
          # sweep would resolve nothing and report a healthy empty run.
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing repository secret: DATABASE_URL"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      # Addresses first. This is not a preference — a hotel with no
      # coordinates cannot clear the match threshold at all, so sweeping
      # before the address arrives spends nothing and skips exactly the
      # hotels the address was meant to rescue. Reads whatahotel.com's public
      # pages; no API key, and no rate-source calls.
      - name: Read hotel pages for street addresses
        if: inputs.sync_pages
        run: |
          set -o pipefail
          npm run pages -- \
            --limit "${{ inputs.pages_limit || 400 }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee pages.log

      - name: Sweep
        run: |
          set -o pipefail
          npm run places -- \
            --limit "${{ inputs.limit || 200 }}" \
            ${{ inputs.verified_unplaced && '--verified-unplaced' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee places.log

      - name: Summarise the run
        if: always()
        run: |
          {
            echo '### Reputation sweep'
            echo
            if [ -f pages.log ]; then
              echo '**Hotel pages**'
              echo
              echo '```'
              tail -10 pages.log
              echo '```'
              echo
            fi
            echo '**Google places**'
            echo
            echo '```'
            tail -30 places.log 2>/dev/null || echo 'no output captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A sweep that verified nothing at all is worth a look even though it
          # is not an error: it is what a wrong threshold and a broken key both
          # look like from the outside.
          if grep -qE '^0 considered' places.log 2>/dev/null; then
            echo "::notice::Nothing was queued — every active hotel is already resolved and fresh."
          elif grep -qE ': .*0 verified' places.log 2>/dev/null; then
            echo "::warning::The sweep verified no hotels. Check the match split before assuming the key is at fault."
          fi

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: places-log-${{ github.run_id }}
          path: |
            places.log
            pages.log
          retention-days: 14
