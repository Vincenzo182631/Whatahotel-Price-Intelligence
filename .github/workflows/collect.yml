# Scheduled rate collection.
#
# This source has NO rate history (U3 — see docs/mvp/README.md): it answers
# "what is the rate now", never "what was it". Every run that does not happen is
# baseline that can never be backfilled, so this workflow is written to fail
# LOUDLY rather than skip quietly.
#
# Required repository secrets:
#   WAH_API_KEY   the WhataHotel data API key (a credential — secrets only)
#   DATABASE_URL  a Postgres reachable from GitHub-hosted runners
#
# If the database is not publicly reachable, this workflow cannot be the thing
# that runs collection — use the self-hosted runner or the cron/systemd recipe
# in docs/runbooks/collection.md instead. The npm commands are identical.

name: Collect rates

on:
  # ── THE SCHEDULE IS LIVE ───────────────────────────────────────────────────
  #
  # Turned on 2026-08-18, after the first real collection: 690 stays planned,
  # 690 fetched, 8,549 rates ingested, 0 rejected. Before that it was
  # deliberately off — a schedule firing four times a day against a database
  # that did not exist would have buried real failures in noise, and noise is
  # how real failures get ignored.
  #
  # The cadence was 6 hours — the scheduler's shortest tier interval, since HOT
  # stays (lead ≤ 30 days, the bookings customers are about to make) want a
  # 6-hour refresh, WARM 24h, COLD 72h, and anything coarser silently caps every
  # tier at the cron period.
  #
  # Every 2 hours since 2026-08-27, and NOT because the tiers changed. GitHub's
  # schedule event is best-effort: its own documentation says firings are
  # delayed or dropped under load, and there is no setting that changes that.
  # Measured here — three of the four expected runs on 2026-08-27 never
  # happened, leaving a 14-hour gap:
  #
  #   08-25   01:11  06:43  12:44  18:37
  #   08-26   01:14  06:47  12:50  19:46
  #   08-27    ——    07:42   ——     ——
  #
  # At a 6-hour cadence one dropped firing means a HOT stay due at T is not
  # collected until T+12h, past assessLiveConfidence's maxRateAgeHours of 12 —
  # so a platform hiccup surfaces to a guest as confidence falling on a hotel
  # whose comparison is perfectly sound. Two dropped firings is 18 hours.
  #
  # So the fix is tolerance, not reliability: the schedule cannot be made to
  # fire, but a dropped firing can be made to cost a twelfth of a day instead
  # of a quarter. The per-run limit drops from 10000 to 3500 in the same change
  # to keep the DAILY budget flat — 12 x 3500 is 42,000 stays against the old
  # 4 x 10000 = 40,000 — so this buys resilience and freshness at no extra API
  # spend and no extra storage. The two numbers move together; changing one
  # alone changes the budget.
  #
  # Frequency does not by itself increase spend: planCollection returns only
  # stays actually due, so a run with nothing due plans nothing. What fills a
  # run is the grid backlog, and that is bounded by the limit either way.
  #
  # Cron is ALWAYS UTC here; GitHub observes no local timezone or DST.
  #
  # If this ever needs turning off again, comment the two lines below rather
  # than deleting them, and say why here. Every day the schedule is off is a
  # day of baseline this source cannot backfill (U3) — it answers "what is the
  # rate now", never "what was it".
  # :23, not :00. Minute zero is the most congested minute GitHub has, and
  # congested minutes are where firings get dropped: measured 2026-08-28, the
  # '0 */2' schedule delivered ONE of six due firings in its first thirteen
  # hours. GitHub's own docs recommend an arbitrary minute for exactly this
  # reason. The watchdog workflow (collect-watchdog.yml) is the backstop for
  # the drops that still happen.
  schedule:
    - cron: '23 */2 * * *'

  workflow_dispatch:
    inputs:
      catalog:
        description: 'Sync the hotel catalogue for this city instead of collecting rates (e.g. miami). Leave blank to collect.'
        required: false
        default: ''
      limit:
        description: 'Max stays to collect in this run'
        required: false
        default: '3500'
      dry_run:
        description: 'Plan only — make no API calls and write nothing'
        type: boolean
        required: false
        default: false
      rebuild_only:
        description: >-
          Rebuild hotel_comparable from stored data and collect nothing. No
          WhataHotel API calls. Use after a change to the comparable builder —
          the stored peer sets are only as current as the last run, and a
          distance bound added in code does nothing to rows already written.
        type: boolean
        required: false
        default: false

# One collection at a time. Two overlapping runs would double the API spend and
# race on the same observation slots. Never cancel a run in progress: a
# half-finished collection still wrote real observations.
concurrency:
  group: collect-rates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 90, not 45: a 3,000-stay catch-up run measures ~35-50 minutes end to
    # end, and the 45-minute cap silently KILLED one mid-ingest on
    # 2026-08-25 (run 38, conclusion "cancelled") — the partial work
    # persisted, but the remaining backlog quietly did not drain. The cap
    # exists to stop a hung run from blocking the 6-hour schedule, and 90
    # still does that with a full cron slot to spare.
    timeout-minutes: 90

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WAH_API_KEY: ${{ secrets.WAH_API_KEY }}
      # Optional. Absent, the reputation step reports NOT_CONFIGURED and the
      # run is unaffected — guest ratings are context beside the price, never
      # a term in any score.
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      # RETENTION RETIRED 2026-09-10: the Neon project moved to the paid
      # Launch plan (branch size limit 16 TB, storage billed per GB-month, not
      # blocked), so RATE_OBSERVATION_RETAIN_DAYS is deliberately UNSET and
      # history accrues — exactly the "after a Neon plan upgrade, delete this
      # line" step this comment block always promised. What the free-tier
      # window cost, and why it existed at all, is preserved in this file's
      # history (7d -> 5d -> 2d, sixteen emergency partition drops, five full
      # ingestion stops between 2026-08-31 and 2026-09-10).
      #
      # If storage spend ever warrants a cap, set the variable again with the
      # new window — the drop machinery in migrate is still there and keys off
      # the variable alone. Do not cap below ~90 days without checking
      # calibration first: point-in-time replay (doc 11) is the reason history
      # is worth paying for.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fail early if the credentials are missing
        run: |
          # Without this the collector would run, get zero rates back, and
          # report a healthy empty run — the exact silent-outage mode the
          # adapter's status handling exists to prevent.
          missing=
          [ -z "$WAH_API_KEY" ] && missing="$missing WAH_API_KEY"
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Apply any pending migrations
        run: node scripts/migrate.mjs

      # A collection run against an empty catalogue plans nothing and exits 0 —
      # the healthy-looking no-op this workflow's header exists to prevent. The
      # grid is built per hotel, so no hotels means no stays, and "no gaps in
      # the grid" is true and useless. Distinguish it from the legitimate
      # nothing-is-due case by looking at the catalogue, not the plan.
      - name: Refuse to collect against an empty catalogue
        if: inputs.catalog == ''
        run: |
          set -euo pipefail
          hotels=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM hotel WHERE is_active AND collection_tier <> 'OFF';")
          echo "Active hotels in the catalogue: $hotels"
          if [ "$hotels" = "0" ]; then
            echo "::error::The catalogue is empty, so this run would plan 0 stays and report success. Run this workflow once with catalog: miami first."
            exit 1
          fi

      - name: Sync the hotel catalogue
        if: inputs.catalog != ''
        run: |
          # There is no dry run for a catalogue sync: it always calls the API.
          # Saying otherwise would spend real calls under a flag that promises
          # not to.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::error::dry_run has no meaning for a catalogue sync — it always calls the API. Re-run with dry_run unchecked."
            exit 1
          fi
          npm run collect -- --catalog "${{ inputs.catalog }}" --concurrency 6 2>&1 | tee collect.log

      # The limit was 500 until 2026-08-20, then 800 briefly the same day,
      # then 1200 (which cleared the demand measured at the time), then 2000
      # on 2026-08-25.
      #
      # 10000 on 2026-08-27, because 2000 was not a cap on spend any more, it
      # was a cap on FUNCTION. mergeTasks served grid top-up before refreshes,
      # so once the backlog passed the limit every run spent its whole budget
      # on top-up and refreshed nothing: "planning 2000 grid top-up(s) and 0
      # refresh(es)" against a 9,231 backlog with at least 2,000 stays due. The
      # tier scheduler had stopped running, tracked prices aged past
      # assessLiveConfidence's 12-hour cap, and guests saw confidence fall on
      # hotels whose comparisons were fine. (mergeTasks now reserves half of
      # each run for refreshes, so that particular starvation cannot recur.)
      #
      # 3500 later the same day, and NOT a walk-back of that raise. The cadence
      # went 6-hourly -> 2-hourly in the same change because GitHub drops
      # scheduled firings, and this came down proportionally to hold the DAILY
      # budget flat: 12 x 3500 = 42,000 stays a day against the old
      # 4 x 10000 = 40,000. Same spend, same storage, three times the tolerance
      # for a dropped firing, and a HOT stay waits at most ~2 hours for
      # collection instead of up to 12.
      #
      # THE CADENCE AND THIS NUMBER MOVE TOGETHER. Raising this without
      # shortening the cadence, or lengthening the cadence without lowering
      # this, changes the daily budget. Since the 2026-09-10 Neon upgrade the
      # budget is a storage COST (billed per GB-month) rather than a hard
      # 512 MB ceiling — a full project no longer fails inserts, but the
      # daily volume still sets what each month of history costs to keep.
      - name: Collect
        if: inputs.catalog == '' && !inputs.rebuild_only
        run: |
          npm run collect -- \
            --limit "${{ inputs.limit || 3500 }}" \
            --concurrency 6 \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee collect.log

          # The collector prints a warning rather than failing when the plan is
          # truncated, because a partial collection is still worth keeping. It
          # must not pass unnoticed, though: uncollected stays are permanently
          # lost data.
          # A full database fails every insert while the run itself "succeeds" —
          # which is how a two-day outage once hid inside green runs. Say it
          # loudly and fail the run.
          if grep -q 'project size limit' collect.log; then
            echo "::error::Database project size limit exceeded — every write is failing. Run the Database maintenance workflow (confirm: apply)."
            exit 1
          fi
          # Two conditions, deliberately annotated differently. Spilling a
          # little is routine and self-correcting — the next run picks it up.
          # Demand at twice capacity is not: the surplus is never collected,
          # the grid rolls forward underneath it, and the queue grows every run
          # while the run still exits 0. One warning for both trained everyone
          # to ignore the warning, which is how the backlog reached 10,206
          # unnoticed.
          if grep -qE 'REFRESHES STARVED|BACKLOG CANNOT DRAIN' collect.log; then
            detail=$(grep -m1 -E 'REFRESHES STARVED|BACKLOG CANNOT DRAIN' collect.log | sed 's/^ *!! *//')
            echo "::warning::$detail"
          elif grep -q 'plan truncated' collect.log; then
            echo "::warning::Plan was truncated — raise --limit or collect more often."
          fi
          # Report the collector's own count, not a line count. The collector
          # emits one summary line reading "N response(s) were invalid JSON",
          # so `grep -c` counted that single line and announced "1 malformed
          # response(s) repaired" on a run that repaired 117.
          repaired=$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) response(s) were invalid JSON.*/\1/p' collect.log | head -1)
          if [ -n "$repaired" ]; then
            echo "::notice::$repaired malformed response(s) repaired (known API defect)."
          fi

      # Reputation, not rates. Deliberately AFTER collection and deliberately
      # unable to fail it: a rating is context beside the price, and a Google
      # outage must never cost us a collection window we cannot backfill (U3).
      #
      # Batched at 200 because the sweep both discovers new hotels and
      # refreshes stale ones, and the queue orders never-looked-at first — so a
      # bounded batch still converges on a growing catalogue rather than
      # spending the whole budget re-reading what it already knows.
      - name: Refresh guest reputation
        if: inputs.catalog == '' && inputs.dry_run != true
        continue-on-error: true
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "GOOGLE_PLACES_API_KEY is not set — skipping the reputation sweep."
            exit 0
          fi
          npm run places -- --limit 200 2>&1 | tail -40

      - name: Summarise the run
        if: always()
        run: |
          {
            echo '### Collection run'
            echo
            echo '```'
            grep -E '^(•|  !|  [0-9]+ stay|✓)' collect.log || echo 'no output captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-log-${{ github.run_id }}
          path: collect.log
          retention-days: 14
