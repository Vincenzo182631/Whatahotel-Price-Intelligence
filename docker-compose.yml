services:
  postgres:
    image: postgres:16-alpine
    container_name: wah-pi-postgres
    environment:
      POSTGRES_USER: wahpi
      POSTGRES_PASSWORD: wahpi
      POSTGRES_DB: wahpi
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wahpi -d wahpi']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
